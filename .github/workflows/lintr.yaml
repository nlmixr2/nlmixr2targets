# Run lintr against PRs and the main branch. The repository's
# `.lintr` file at the root configures which linters are active.
# Stacked PRs (based on another PR's branch) skip CI; a PR runs once it
# targets main, including when it is retargeted there (edited, base
# changed).  Other PR edits start a run whose jobs are all skipped.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, edited]

name: lintr.yaml

permissions: read-all

jobs:
  lintr:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::cyclocomp, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
